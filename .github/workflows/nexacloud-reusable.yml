name: NexaCloud Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment name (dev, testing, prod)'
        required: true
        type: string
      aws_region:
        description: 'Target AWS deployment region'
        required: false
        type: string
        default: 'eu-west-1'
      eks_cluster:
        description: 'Name of your target EKS cluster'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string

env:
  IMAGE_NAME: nexacloud-app

# Required permissions block for secure AWS OIDC role assumption
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm ci

      - name: Run tests (safe fallback)
        run: npm test || echo "No tests defined, skipping..."

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, Scan and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          load: false  # Do not load locally if pushing directly to minimize processing
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest-${{ inputs.environment }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans the remote registry image directly, avoiding the duplicate local build step
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Upgraded to secure, keyless OIDC Authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ inputs.eks_cluster }} \
            --region ${{ inputs.aws_region }}

      - name: Create namespace (idempotent)
        run: |
          kubectl create namespace ${{ inputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ -n ${{ inputs.namespace }}

      - name: Update image
        run: |
          kubectl set image deployment/nexacloud-app \
            nexacloud-app=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} \
            -n ${{ inputs.namespace }}

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/nexacloud-app -n ${{ inputs.namespace }} --timeout=300s 

      - name: Send status to Self-Hosted Grafana Loki
        if: always()
        run: |
          TIMESTAMP=$(date +%s%N)
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "streams": [
                {
                  "stream": {
                    "job": "github-actions",
                    "pipeline": "nexacloud-deploy",
                    "environment": "${{ inputs.environment }}",
                    "status": "${{ job.status }}",
                    "run_id": "${{ github.run_id }}",
                    "actor": "${{ github.actor }}"
                  },
                  "values": [
                    [ "'$TIMESTAMP'", "Pipeline [${{ inputs.environment }}] finished with status: ${{ job.status }}. Triggered by ${{ github.actor }}." ]
                  ]
                }
              ]
            }' \
            ${{ secrets.GRAFANA_LOKI_URL }}/loki/api/v1/push

name: NexaCloud Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: 'eu-west-1'
      eks_cluster:
        required: true
        type: string
      namespace:
        required: true
        type: string

    # --- ADD THIS BLOCK TO FIX THE ERROR ---
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true
      GRAFANA_LOKI_URL:
        required: true
    # --------------------------------------

permissions:
  id-token: write
  contents: read

jobs:
  code_quality_stage:
    name: Quality Phase
    uses: ./.github/workflows/code-quality.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy_stage:
    name: Deployment Phase
    needs: code_quality_stage
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ inputs.environment }}
      aws_region: ${{ inputs.aws_region }}
      eks_cluster: ${{ inputs.eks_cluster }}
      namespace: ${{ inputs.namespace }}
      image_tag: ${{ needs.code_quality_stage.outputs.image_tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}

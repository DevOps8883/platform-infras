apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexacloud-app
  namespace: nexacloud
spec:
  replicas: 1
  strategy:
     type: Recreate
  selector:
    matchLabels:
      app: nexacloud-app
  template:
    metadata:
      labels:
        app: nexacloud-app
    spec:
      containers:
        - name: nexacloud-app
          image: davidadeleke23/nexacloud-app:v1.0.0 # Use specific tags
          ports:
            - containerPort: 3000
          resources: # Prevents node crashes
            limits:
              cpu: "300m"
              memory: "300Mi"
            requests:
              cpu: "100m"
              memory: "150Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexacloud-secrets
                  key: db-url
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

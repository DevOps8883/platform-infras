apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexacloud-app
  namespace: nexacloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexacloud-app
  template:
    metadata:
      labels:
        app: nexacloud-app
    spec:
      containers:
        - name: nexacloud-container
          image: davidadeleke23/nexacloud-app:v1.0.0 # Use specific tags
          ports:
            - containerPort: 8080
          resources: # Prevents node crashes
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexacloud-secrets
                  key: db-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

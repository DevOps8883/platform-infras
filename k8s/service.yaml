apiVersion: v1
kind: Service
metadata:
  name: nexacloud-service
  namespace: nexacloud
spec:
  type: LoadBalancer
  selector:
    app: nexacloud-app # Must match the label in your Deployment
  ports:
    - protocol: TCP
      port: 80         # Port accessible from the browser
      targetPort: 3000 # Port your Node.js app is listening on

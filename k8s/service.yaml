apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexacloud-app
  namespace: nexacloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexacloud-app
  template:
    metadata:
      labels:
        app: nexacloud-app
    spec:
      containers:
        - name: nexacloud-app   # MUST match workflow
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
